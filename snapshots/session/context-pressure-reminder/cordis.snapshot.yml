# Keyless replay counterpart of context-pressure-reminder's cordis.yml: the same
# guard mount, with the replay adapter in place of the live DeepSeek provider.
# `contextWindow: 128000` gives the reading its `/128.0k · N%` shape.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: context-pressure-reminder
      name: '../../../packages/guard/context-pressure-reminder/src/index.ts'
      config:
        minDeltaRatio: 0
    - id: llm-replay
      name: '../../../packages/test-support/llm-replay/src/index.ts'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
