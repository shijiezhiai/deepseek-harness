# Keyless replay counterpart of context-pressure-nudge's cordis.yml: the same
# guard and compaction configuration, with the replay adapter in place of the
# live DeepSeek provider. `contextWindow: 8500` puts the recorded ~8.1k session
# inside the danger band, whose floor is 10% of the window.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99

- id: context-pressure-reminder
  name: '@deepseek-ai/dsh-context-pressure-reminder'
  config:
    minDeltaRatio: 0

- insert:
    - id: llm-replay
      name: '../../../packages/test-support/llm-replay/src/index.ts'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8500
