# Keyless replay counterpart of context-compact-tool's cordis.yml, with the
# replay adapter in place of the live DeepSeek provider.
#
# The headless profile publishes `deepseek-v4-flash` at 128000 tokens, which
# would put this session near 6% — under the request floor
# (`requestPolicy.minContextRatio` 0.10), so `compact_context` would only ever
# be declined. The `llm-deepseek` entry below is disabled, but its catalog still
# resolves the route the replay adapter serves, so the window is republished
# here at 20000: roughly 40% occupancy, above the floor and below
# `thresholdRatio` 0.99 so automatic pressure compaction cannot race the
# request.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 20000

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99

- insert:
    - id: llm-replay
      name: '../../../packages/test-support/llm-replay/src/index.ts'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 20000
